{% extends "base.html" %}

{% block content %}

<section class="section">

    <div class="page-heading">

        <div>

            <h1>All Products</h1>

            <p>
                Find products you'll love.
            </p>

        </div>

    </div>


    <form
        class="filter-bar"
        method="GET"
    >

        <input
            type="text"
            name="search"
            placeholder="Search products..."
            value="{{ request.args.get('search','') }}"
        >

        <select name="category">

            <option value="">
                All Categories
            </option>

            {% for category in categories %}

            <option
                value="{{ category }}"
                {% if request.args.get('category') == category %}
                selected
                {% endif %}
            >
                {{ category }}
            </option>

            {% endfor %}

        </select>

        <button class="btn">
            Search
        </button>

    </form>


    <div class="product-grid">

        {% for product in products %}

        <div class="product-card">

            <div class="product-image">

                <img
                    src="{{ url_for(
                        'static',
                        filename='images/products/' + product.image
                    ) }}"
                    onerror="this.src='https://via.placeholder.com/400x300?text=Product'"
                >

            </div>

            <div class="product-info">

                <small>
                    {{ product.category }}
                </small>

                <h3>
                    {{ product.name }}
                </h3>

                <p>
                    {{ product.description }}
                </p>

                <h3>
                    ₹{{ "%.2f"|format(product.price) }}
                </h3>

                <div class="actions">

                    <a
                        class="small-btn"
                        href="{{ url_for(
                            'products.product_details',
                            id=product.id
                        ) }}"
                    >
                        Details
                    </a>

                    <form
                        method="POST"
                        action="{{ url_for(
                            'cart.add_to_cart',
                            product_id=product.id
                        ) }}"
                    >

                        <button class="cart-btn">
                            Add to Cart
                        </button>

                    </form>

                </div>

            </div>

        </div>

        {% else %}

        <div class="empty">
            No products found.
        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
