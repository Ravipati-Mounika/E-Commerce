<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="box">

    <h2>Register</h2>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Register</button>

    </form>

    <p>
        Already registered?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
