{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>Join ShopSphere today</p>

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Full name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button class="btn">
                Create Account
            </button>

        </form>

    </div>

</div>

{% endblock %}
