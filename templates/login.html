{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>Login to continue shopping</p>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button class="btn">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
